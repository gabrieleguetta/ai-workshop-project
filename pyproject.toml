[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
files = ["main.py", "agent.py", "models.py", "state.py", "tools.py", "checks.py", "rendering.py", "providers.py"]
